# Sits in front of rserver (127.0.0.1:8788) on the container port, 8787.
#
# Location paths are the ones rserver sees: HeLx resty strips the
# /private/<app>/<user>/<guid> prefix before forwarding. Regex locations match
# nginx's decoded, normalised $uri; checks on $request_uri see the raw URI,
# which is what rserver receives.

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # uploads, downloads and the /events long poll stream straight through
    client_max_body_size    0;
    proxy_http_version      1.1;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      1d;
    proxy_send_timeout      1d;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Remove the HeLx appstore's session and CSRF cookies. rserver never uses
    # them, and its /p/ proxy would pass them on to whatever is listening on
    # localhost. Each map removes one cookie, so three passes cover a browser
    # holding duplicates.
    map $http_cookie $cookie_pass1 {
        "~^(?:sessionid|csrftoken)=[^;]*;?\s*(.*)$"     $1;
        "~^(.*?);\s*(?:sessionid|csrftoken)=[^;]*(.*)$" $1$2;
        default                                         $http_cookie;
    }
    map $cookie_pass1 $cookie_pass2 {
        "~^(?:sessionid|csrftoken)=[^;]*;?\s*(.*)$"     $1;
        "~^(.*?);\s*(?:sessionid|csrftoken)=[^;]*(.*)$" $1$2;
        default                                         $cookie_pass1;
    }
    map $cookie_pass2 $cookie_forwarded {
        "~^(?:sessionid|csrftoken)=[^;]*;?\s*(.*)$"     $1;
        "~^(.*?);\s*(?:sessionid|csrftoken)=[^;]*(.*)$" $1$2;
        default                                         $cookie_pass2;
    }

    # Help and help-like pages that evaluate R code from the file the request
    # names (Rd \Sexpr, knitting R presentations). Only the IDE itself may
    # open them; a link, another site or a sandboxed page may not.
    map $http_sec_fetch_site $from_ide {
        same-origin 1;
        default     0;
    }
    map $uri $evaluates_r_code {
        "~^/(?:help|custom|session)/(?:preview|presentation)" 1;
        default                                               0;
    }
    map $args $has_dev_param {
        "~*(?:^|&)(?:d|%64)(?:e|%65)(?:v|%76)="              1;
        default                                               0;
    }
    map "$from_ide:$evaluates_r_code$has_dev_param" $reject_help {
        "~^0:(?!00)" 1;
        default      0;
    }

    # The R help server redirects to absolute URLs that rserver rebuilds from
    # the Referer header, so a Referer from another site must not reach it.
    map $http_sec_fetch_site $help_referer {
        same-origin $http_referer;
        ""          $http_referer;
        default     "";
    }

    server {
        listen 8787;

        # localhost web apps (Shiny, Plumber, the terminal websocket). Without
        # a port-token cookie rserver falls back to a well-known token.
        location ~ ^/p6?/ {
            if ($http_cookie !~ "(?:^|;\s*)port-token=") {
                return 404;
            }
            include /etc/nginx/rstudio/proxy.inc;
        }

        # Raw user files: an opaque-origin sandbox, so script in them cannot
        # read the IDE page or its CSRF token.
        location ~ ^/(?:files/|file_show) {
            include /etc/nginx/rstudio/proxy.inc;
            include /etc/nginx/rstudio/sandbox.inc;
        }

        # Only the uuid-named files RStudio provisions itself. The IDE frames
        # these and needs same-origin access to them, so script is blocked
        # instead of the origin being made opaque.
        location ~ ^/content$ {
            if ($args !~ "^title=[^&]*&file=[0-9a-f]{32}(?:\.[A-Za-z0-9]+)?$") {
                return 404;
            }
            include /etc/nginx/rstudio/proxy.inc;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "sandbox allow-same-origin; frame-ancestors 'self'" always;
        }

        # The output id indexes a fixed table (kMaxRenderOutputs = 5 in
        # SessionRMarkdown.cpp) without a bounds check, and the mathjax/ branch
        # resolves the URL-decoded path with no containment check.
        location ~ ^/rmd_output {
            if ($request_uri !~ "^/rmd_output/[0-4]/") {
                return 404;
            }
            if ($request_uri ~* "^[^?]*(?:%2e|%2f|%5c|\.\.)") {
                return 404;
            }
            include /etc/nginx/rstudio/proxy.inc;
        }

        # The figure name is joined onto the package's man/figures directory
        # unchecked, so it may not contain a path separator.
        location ~ ^/(?:help|custom|session)/dev-figure$ {
            if ($args !~ "^pkg=[A-Za-z0-9.]+&figure=(?:[A-Za-z0-9._~+-]|%[0-9A-Fa-f]{2})+$") {
                return 404;
            }
            if ($args ~* "%2f|%5c") {
                return 404;
            }
            include /etc/nginx/rstudio/proxy.inc;
            include /etc/nginx/rstudio/sandbox.inc;
        }

        location ~ ^/(?:help|custom|session) {
            if ($reject_help) {
                return 403;
            }
            include /etc/nginx/rstudio/proxy.inc;
            proxy_set_header Referer $help_referer;
        }

        location / {
            include /etc/nginx/rstudio/proxy.inc;
        }
    }
}
