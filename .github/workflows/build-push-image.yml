name: Build-Push-Image
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
jobs:
  build-push-image:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
        fetch-depth: 0

    - name: Set short git commit SHA
      id: vars
      run: |
        echo "short_sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

    - name: Confirm git commit SHA output
      run: echo ${{ steps.vars.outputs.short_sha }}

    # Docker Buildx is important to caching in the Build And Push Container
    # step
    # https://github.com/marketplace/actions/build-and-push-docker-images
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: containers.renci.org
        username: ${{ secrets.CONTAINERHUB_USERNAME }}
        password: ${{ secrets.CONTAINERHUB_TOKEN }}
        logout: true

    - name: Read version from config.env
      id: version
      run: |
        VERSION=$(grep '^VERSION=' config.env | cut -d'=' -f2 | tr -d '"')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Using version: ${VERSION}"

    - name: Compute image tags
      id: tags
      run: |
        IMAGE="containers.renci.org/${{ github.repository }}"
        VERSION="${{ steps.version.outputs.version }}"
        SHORT_SHA="${{ steps.vars.outputs.short_sha }}"
        EVENT="${{ github.event_name }}"

        echo "tags<<EOF" >> $GITHUB_OUTPUT
        if [ "$EVENT" = "pull_request" ]; then
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "${IMAGE}:test_${PR_NUM}" >> $GITHUB_OUTPUT
          echo "${IMAGE}:test_${PR_NUM}-${SHORT_SHA}" >> $GITHUB_OUTPUT
        else
          BRANCH="${{ github.ref_name }}"
          echo "${IMAGE}:${VERSION}" >> $GITHUB_OUTPUT
          echo "${IMAGE}:${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "${IMAGE}:${BRANCH}" >> $GITHUB_OUTPUT
        fi
        echo "EOF" >> $GITHUB_OUTPUT

    # Build the local builder image first
    - name: Create and push builder image
      id: base-builder
      run: |
        chmod +x create-builder-image.sh
        echo "Running script to create the local builder image..."
        BUILDER_IMAGE=$(./create-builder-image.sh | tail -n1)
        echo "Publishing builder image: $BUILDER_IMAGE"
        docker push $BUILDER_IMAGE
        echo "builder_image=$BUILDER_IMAGE" >> $GITHUB_OUTPUT

    - name: Build and Push Final Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        build-args: |
          BASE_IMAGE=${{ steps.base-builder.outputs.builder_image }}
        # This build will use the local builder image created in the previous step.
        # It then pushes the final image to renci-registry and dockerhub.
        # Cache for this final image comes from dockerhub.
        tags: ${{ steps.tags.outputs.tags }}
